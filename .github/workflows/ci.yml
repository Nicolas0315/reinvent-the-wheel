name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Format check
        run: ruff format --check .
      - name: Lint (report only, pre-existing debt not gated)
        run: ruff check .
        continue-on-error: true
      - name: Fuzz test (myers_diff, 2008 cases, two independent oracles)
        run: python test_rewheel.py
